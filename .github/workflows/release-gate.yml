name: Release Gate

permissions:
  contents: read
  statuses: write

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use repository Node version
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Use Firestore emulator Java runtime
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Use repository npm version
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"

      - name: Install dependencies
        run: npm ci

      - name: Verify release discipline for pull request
        if: github.event_name == 'pull_request'
        env:
          RELEASE_BASE_REF: origin/${{ github.base_ref }}
        run: npm run release:discipline

      - name: Verify release discipline for main push
        if: github.event_name == 'push'
        env:
          RELEASE_BASE_REF: ${{ github.event.before }}
        run: npm run release:discipline

      - name: Verify release and production build
        run: npm run release:verify

      - name: Notify Vercel deployment check
        uses: vercel/repository-dispatch/actions/status@v1
        with:
          name: "Vercel - nafiqpm6: release-verify"
