  <script>
    // Apply the saved theme before Angular and CSS render to avoid a light-mode flash.
    (function () {
      try {
        if (localStorage.getItem('darkMode') === 'true') {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0f172a');
        }
      } catch (_) {}
    })();
  </script>
  
  <title>NAFIQPM6 | LIMS Cloud | Hệ thống quản lý phòng thí nghiệm</title>
  
  <!-- 1. Apple Touch Icon (iOS Home Screen) -->
  <link rel="apple-touch-icon" href="icons/icon-192x192.png">
  <link rel="icon" type="image/png" href="icons/icon-72x72.png">

  <!-- 2. Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700;800&amp;family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- 5. Global CSS -->
  <style>
    body { 
        font-family: 'Open Sans', sans-serif;
    }
    
    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #a0aec0; }
    
    html.dark ::-webkit-scrollbar-thumb { background: #475569; }
    html.dark ::-webkit-scrollbar-thumb:hover { background: #64748b; }
    
    html.dark input[type="date"],
    html.dark input[type="time"],
    html.dark input[type="datetime-local"],
    html.dark input[type="month"] {
        color-scheme: dark;
    }
    
    /* Animations */
    .fade-in { animation: fadeIn 0.5s ease-out; }
    .bounce-in { animation: bounceIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes bounceIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }

    /* Print Overrides - CRITICAL FOR DIRECT PRINT */
    @media print {
      @page { size: A4 portrait; margin: 0; }
      
      html, body {
          width: 210mm;
          height: 297mm;
          margin: 0 !important;
          padding: 0 !important;
          background: white !important;
      }

      /* Hide the main app entirely */
      app-root { display: none !important; }
      
      /* Show the print container */
      #print-container { 
          display: block !important; 
          position: fixed; /* Fixed prevents scrolling issues */
          top: 0 !important;
          left: 0 !important;
          width: 100%;
          height: 100%;
          margin: 0 !important;
          padding: 0 !important;
          background: white;
          z-index: 99999;
      }
    }
    
    /* Screen styles for print container (Hidden by default) */
    #print-container { display: none; }
  </style>
  <link rel="manifest" href="manifest.webmanifest">
</head>
<body class="antialiased text-gray-600 dark:text-slate-400 bg-gray-50 dark:bg-slate-900 h-full overflow-hidden transition-colors duration-300">
  <script>
    // Handle the legacy client-side Drive OAuth response BEFORE Angular bootstraps.
    // Firebase Google login now uses signInWithRedirect/getRedirectResult and
    // must not expose or parse an ID token in this page.
    (function() {
      var h = window.location.hash || '';
      var handled = false;

      if (h.charAt(1) !== '/') {
        var params = new URLSearchParams(h.substring(1));
        var idToken = params.get('id_token');
        var token = params.get('access_token');
        var exp = params.get('expires_in');
        var oauthError = params.get('error');

        // Reject old manual-login responses instead of trusting an ID token
        // supplied through the application URL.
        if (idToken) {
          sessionStorage.removeItem('__gd_token');
          sessionStorage.removeItem('__gd_expiry');
          sessionStorage.removeItem('__google_id_token');
          sessionStorage.setItem('__google_redirect_error', 'legacy_google_redirect');
          handled = true;
        } else if (token) {
          // Google Drive client-side fallback (kept separate from Firebase login).
          sessionStorage.setItem('__gd_token', token);
          sessionStorage.setItem('__gd_expiry', '' + (Date.now() + (parseInt(exp || '3600') - 300) * 1000));
          handled = true;
        } else if (oauthError) {
          sessionStorage.setItem('__google_redirect_error', oauthError);
          handled = true;
        }
      }

      // Restore route if any auth was handled
      if (handled) {
        var route = sessionStorage.getItem('__gd_route') || '#/';
        sessionStorage.removeItem('__gd_route');
        var safeRoute = route.indexOf('#/') === 0 ? route : '#/';
        window.location.replace(window.location.pathname + safeRoute);
      }
    })();
  </script>
  <app-root></app-root>
  <!-- Dedicated Container for Direct Printing -->
  <div id="print-container"></div>
  <noscript>Vui lòng bật JavaScript để sử dụng ứng dụng này.</noscript>
</body>
</html>
