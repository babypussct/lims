<section class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm dark:border-slate-800 dark:bg-slate-900" aria-label="Biểu đồ phân bổ ca trực">
  <div class="mb-3 flex flex-wrap items-start justify-between gap-2">
    <div>
      <h2 class="text-sm font-black text-slate-800 dark:text-slate-100">Phân bổ lượt trực</h2>
      <p class="mt-1 text-xs text-slate-500 dark:text-slate-400">Ngày thường + cuối tuần = tổng lượt. Đường nét đứt là mức kỳ vọng riêng theo thời gian hiệu lực. ★ là số lần chủ trì và không cộng vào chiều cao cột.</p>
    </div>
    @if (rangeLabel()) {
      <span class="rounded-full bg-slate-100 px-2.5 py-1 text-[10px] font-black text-slate-500 dark:bg-slate-800 dark:text-slate-300">{{ rangeLabel() }}</span>
    }
  </div>
  @if (stats().length) {
    <div class="h-80 min-w-0 overflow-x-auto">
      <div class="h-full" [style.min-width.px]="stats().length > 10 ? stats().length * 76 : null">
        <canvas #chartCanvas aria-label="Biểu đồ cột chồng số ca ngày thường và cuối tuần theo nhân viên" role="img"></canvas>
      </div>
    </div>
  } @else {
    <div class="rounded-xl border border-dashed border-slate-200 px-4 py-12 text-center text-sm italic text-slate-400 dark:border-slate-700">Chưa có dữ liệu để vẽ biểu đồ.</div>
  }
</section>
