<div class="bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 rounded-2xl shadow-sm overflow-hidden transition-all duration-200">
  <!-- Header Section (Clickable to Toggle) -->
  <button type="button" (click)="toggleExpand.emit()" [attr.aria-expanded]="isExpanded"
       class="w-full px-4 py-3 bg-slate-50/70 dark:bg-slate-950/30 hover:bg-slate-100/70 dark:hover:bg-slate-800/40 cursor-pointer flex flex-wrap items-center justify-between gap-3 text-left transition-colors"
       [class.border-b]="isExpanded"
       [class.border-slate-100]="isExpanded"
       [class.dark:border-slate-800]="isExpanded">
    <div class="flex flex-wrap items-center gap-2.5 min-w-0">
      <div class="w-7 h-7 rounded-lg bg-indigo-50 dark:bg-indigo-950/40 text-indigo-600 dark:text-indigo-400 flex items-center justify-center border border-indigo-200/60 dark:border-indigo-900/40 shrink-0">
        <i class="fa-solid fa-circle-info text-xs" aria-hidden="true"></i>
      </div>
      <div class="flex flex-wrap items-center gap-x-3 gap-y-1 text-xs min-w-0">
        <span class="font-bold text-slate-800 dark:text-slate-100 font-mono select-all">{{ run?.inputs?.['batchCode'] || run?.id || 'Chưa có mã mẻ' }}</span>
        <span class="text-slate-300 dark:text-slate-700 hidden sm:inline">·</span>
        <span class="text-slate-600 dark:text-slate-300 font-medium truncate max-w-[180px]">{{ displayDevice }}</span>
        <span class="text-slate-300 dark:text-slate-700 hidden sm:inline">·</span>
        <span class="text-slate-600 dark:text-slate-300 font-medium">{{ run?.analysisDate ? formatAnalysisDateFn(run.analysisDate) : 'Chưa thiết lập' }}</span>
        <span class="text-slate-300 dark:text-slate-700 hidden md:inline">·</span>
        <span class="text-slate-600 dark:text-slate-300 font-medium hidden md:inline">{{ run?.user || 'Chưa thiết lập' }}</span>
      </div>
    </div>
    <div class="flex items-center gap-2 shrink-0">
      <span class="text-[11px] font-bold px-2.5 py-0.5 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 max-w-[200px] sm:max-w-xs truncate border border-slate-200/70 dark:border-slate-700"
            [title]="run?.sampleList ? formatSampleListFn(run.sampleList) : ''">
        {{ run?.sampleList?.length || 0 }} mẫu
      </span>
      <span class="w-6 h-6 rounded-lg flex items-center justify-center text-slate-400">
        <i class="fa-solid fa-chevron-down text-xs transition-transform duration-200" [class.rotate-180]="isExpanded" aria-hidden="true"></i>
      </span>
    </div>
  </button>

  <!-- Body Section (Collapsible) -->
  @if (isExpanded) {
    <div class="p-4 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3 text-xs bg-slate-50/30 dark:bg-slate-900/20 animate-fade-in">
      <div class="p-3 bg-white dark:bg-slate-900 rounded-xl border border-slate-200/70 dark:border-slate-800">
        <span class="block text-[10px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider mb-1">Mã mẻ chạy</span>
        <span class="font-mono font-bold text-slate-800 dark:text-slate-100 break-all select-all flex items-center gap-1.5">
          <i class="fa-solid fa-barcode text-indigo-500 opacity-80" aria-hidden="true"></i>
          {{ run?.inputs?.['batchCode'] || run?.id || 'Chưa có mã mẻ' }}
        </span>
      </div>
      <div class="p-3 bg-white dark:bg-slate-900 rounded-xl border border-slate-200/70 dark:border-slate-800">
        <span class="block text-[10px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider mb-1">Thiết bị phân tích</span>
        <span class="font-bold text-slate-700 dark:text-slate-200 flex items-center gap-1.5">
          <i class="fa-solid fa-microscope text-indigo-500 opacity-80" aria-hidden="true"></i>
          {{ displayDevice }}
        </span>
      </div>
      <div class="p-3 bg-white dark:bg-slate-900 rounded-xl border border-slate-200/70 dark:border-slate-800">
        <span class="block text-[10px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider mb-1">Ngày phân tích</span>
        <span class="font-bold text-slate-700 dark:text-slate-200 flex items-center gap-1.5">
          <i class="fa-regular fa-calendar text-emerald-500 opacity-80" aria-hidden="true"></i>
          {{ run?.analysisDate ? formatAnalysisDateFn(run.analysisDate) : 'Chưa thiết lập' }}
        </span>
      </div>
      <div class="p-3 bg-white dark:bg-slate-900 rounded-xl border border-slate-200/70 dark:border-slate-800">
        <span class="block text-[10px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider mb-1">Kiểm nghiệm viên</span>
        <span class="font-bold text-slate-700 dark:text-slate-200 flex items-center gap-1.5">
          <i class="fa-solid fa-user text-amber-500 opacity-80" aria-hidden="true"></i>
          {{ run?.user || 'Chưa thiết lập' }}
        </span>
      </div>
    </div>
  }
</div>
