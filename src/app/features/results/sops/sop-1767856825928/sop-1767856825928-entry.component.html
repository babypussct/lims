<div class="space-y-5 animate-fade-in">
  <!-- Form Selection Switcher -->
  <div class="flex flex-wrap items-center justify-between gap-4 p-3.5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 shadow-sm">
    <div class="flex items-center gap-3">
      <span class="text-xs font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider">Hình thức in kết quả:</span>
      <div class="inline-flex bg-slate-100 dark:bg-slate-950 p-1 rounded-xl border border-slate-200 dark:border-slate-800 select-none items-center">
        <button type="button"
                (click)="setPrintFormType('formCheck')"
                [disabled]="isReadOnly"
                [class]="draft.page1Data['printFormType'] === 'formCheck'
                  ? 'px-3.5 py-1.5 text-xs font-bold rounded-lg bg-indigo-600 text-white shadow-xs transition active:scale-95 disabled:opacity-60 disabled:cursor-not-allowed'
                  : 'px-3.5 py-1.5 text-xs font-semibold rounded-lg text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white transition disabled:opacity-60 disabled:cursor-not-allowed'">
          FORM CHECK
        </button>
        <button type="button"
                (click)="setPrintFormType('formDon')"
                [disabled]="isReadOnly"
                [class]="draft.page1Data['printFormType'] === 'formDon'
                  ? 'px-3.5 py-1.5 text-xs font-bold rounded-lg bg-indigo-600 text-white shadow-xs transition active:scale-95 disabled:opacity-60 disabled:cursor-not-allowed'
                  : 'px-3.5 py-1.5 text-xs font-semibold rounded-lg text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white transition disabled:opacity-60 disabled:cursor-not-allowed'">
          FORM ĐƠN
        </button>
      </div>
    </div>
  </div>

  <!-- TAB 1: COMPOUND RESULTS GRID (FORM CHECK) -->
  @if (draft.page1Data['printFormType'] === 'formCheck') {
    <div class="space-y-5">
      <app-sop-header-metadata
        [title]="'Thông tin chung & Đánh giá (SOP: ' + (run?.sopCode || 'Nhóm Cúc') + ')'"
        [draft]="draft"
        [checkboxList]="checkboxList"
        [isReadOnly]="isReadOnly"
        (draftChanged)="onDataChanged()">
        <div sop-metadata-extra class="grid grid-cols-1 md:grid-cols-3 gap-4 border-t border-slate-100 dark:border-slate-800 pt-3 mt-4">
          <div>
            <label class="block text-[10px] font-bold text-slate-500 dark:text-slate-400 mb-1.5 uppercase tracking-wider">2. Khối lượng mẫu (g)</label>
            <div class="flex items-center gap-1.5 p-1 bg-slate-100/80 dark:bg-slate-900 rounded-xl border border-slate-200/70 dark:border-slate-800">
              <label class="flex items-center gap-2 px-2 py-1.5 cursor-pointer shrink-0">
                <input type="checkbox"
                       [checked]="draft.page1Data['is10gChecked'] !== false"
                       (change)="on10gCheckChange($event)"
                       class="w-4 h-4 text-indigo-600 rounded border-slate-300 focus:ring-indigo-500" />
                <span class="text-xs font-bold text-slate-700 dark:text-slate-300">10.0g</span>
              </label>
              <input type="text"
                     [(ngModel)]="draft.page1Data['khoiLuongKhac']"
                     (ngModelChange)="onKhoiLuongKhacChange()"
                     placeholder="Khối lượng khác..."
                     [disabled]="draft.page1Data['is10gChecked'] !== false"
                     class="w-full bg-white dark:bg-slate-950 border border-slate-200 dark:border-slate-700 rounded-lg px-3 py-1.5 text-xs font-bold text-slate-800 dark:text-slate-200 focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition outline-none disabled:opacity-50 disabled:bg-slate-50" />
            </div>
          </div>
          <div>
            <label class="block text-[10px] font-bold text-slate-500 dark:text-slate-400 mb-1.5 uppercase tracking-wider">3. Loại mẫu</label>
            <div class="flex items-center gap-1.5 overflow-x-auto py-0.5 max-w-full custom-scrollbar">
              <button type="button"
                      (click)="draft.page1Data['loaiMau'] = 'Nông sản tươi'; onDataChanged()"
                      [class]="draft.page1Data['loaiMau'] === 'Nông sản tươi'
                        ? 'px-2.5 py-2 text-xs font-bold rounded-xl bg-indigo-600 text-white shadow-xs border border-indigo-600 transition shrink-0 active:scale-95'
                        : 'px-2.5 py-2 text-xs font-semibold rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition shrink-0 active:scale-95'"
                      title="Chọn Nông sản tươi">Tươi</button>
              <button type="button"
                      (click)="draft.page1Data['loaiMau'] = 'Nông sản khô'; onDataChanged()"
                      [class]="draft.page1Data['loaiMau'] === 'Nông sản khô'
                        ? 'px-2.5 py-2 text-xs font-bold rounded-xl bg-indigo-600 text-white shadow-xs border border-indigo-600 transition shrink-0 active:scale-95'
                        : 'px-2.5 py-2 text-xs font-semibold rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition shrink-0 active:scale-95'"
                      title="Chọn Nông sản khô">Khô</button>
              <button type="button"
                      (click)="draft.page1Data['loaiMau'] = 'Thủy sản'; onDataChanged()"
                      [class]="draft.page1Data['loaiMau'] === 'Thủy sản' || draft.page1Data['loaiMau'] === 'Thuỷ sản'
                        ? 'px-2.5 py-2 text-xs font-bold rounded-xl bg-indigo-600 text-white shadow-xs border border-indigo-600 transition shrink-0 active:scale-95'
                        : 'px-2.5 py-2 text-xs font-semibold rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition shrink-0 active:scale-95'"
                      title="Chọn Thủy sản">Thủy Sản</button>
              <input type="text"
                     [ngModel]="['Nông sản tươi', 'Nông sản khô', 'Thủy sản', 'Thuỷ sản'].includes(draft.page1Data['loaiMau']) ? '' : draft.page1Data['loaiMau']"
                     (ngModelChange)="draft.page1Data['loaiMau'] = $event; onDataChanged()"
                     placeholder="Khác..."
                     class="w-full min-w-[70px] bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-xs font-bold text-slate-800 dark:text-slate-200 focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition outline-none" />
            </div>
          </div>
          <div>
            <label class="block text-[10px] font-bold text-slate-500 dark:text-slate-400 mb-1.5 uppercase tracking-wider">4. Tình trạng mẫu</label>
            <div class="flex items-center gap-1.5">
              <button type="button"
                      (click)="draft.page1Data['tinhTrangMau'] = 'Bình thường'; onDataChanged()"
                      [class]="draft.page1Data['tinhTrangMau'] === 'Bình thường'
                        ? 'px-3 py-2 text-xs font-bold rounded-xl bg-indigo-600 text-white shadow-xs border border-indigo-600 transition shrink-0 active:scale-95'
                        : 'px-3 py-2 text-xs font-semibold rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition shrink-0 active:scale-95'"
                      title="Chọn Bình thường">Bình Thường</button>
              <input type="text"
                     [ngModel]="draft.page1Data['tinhTrangMau'] === 'Bình thường' ? '' : draft.page1Data['tinhTrangMau']"
                     (ngModelChange)="draft.page1Data['tinhTrangMau'] = $event; onDataChanged()"
                     placeholder="Khác..."
                     class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-xs font-bold text-slate-800 dark:text-slate-200 focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition outline-none" />
            </div>
          </div>
        </div>
      </app-sop-header-metadata>

      <app-sop-master-detail-compound-grid
        [run]="run"
        [draft]="draft"
        [config]="config"
        [compoundDisplayNames]="compoundDisplayNames()"
        [activeSampleCode]="activeSampleCode()"
        [publishedSampleSet]="publishedSampleSet"
        [isReadOnly]="isReadOnly"
        (activeSampleChange)="selectSample($event)"
        (toggleSampleSelected)="toggleSampleSelected($event.sampleCode, $event.checked)"
        (toggleSelectAll)="toggleSelectAllSamples()"
        (bulkFillNd)="sampleBulkFillND()"
        (bulkQcPass)="sampleBulkQC()"
        (copySampleToAll)="copyActiveSampleToAll()"
        (ndChanged)="onNdCheckboxChanged($event)"
        (resultChanged)="onResultInputChanged($event)"
        (qcChanged)="setCompoundQc($event.compound, $event.qcKey, $event.status)"
        (sampleMassChanged)="onDataChanged()" />
    </div>
  }

  <!-- TAB 2: CALIBRATION CURVE & SAMPLE RUNS (FORM ĐƠN) -->
  @if (draft.page1Data['printFormType'] === 'formDon') {
    <div class="space-y-5">
      <app-sop-header-metadata
        [title]="'Thông tin chung & Đánh giá (SOP: ' + (run?.sopCode || 'Nhóm Cúc') + ')'"
        [draft]="draft"
        [checkboxList]="[]"
        [isReadOnly]="isReadOnly"
        (draftChanged)="onDataChanged()" />

      <app-sop-form-don-workspace
        [run]="run"
        [draft]="draft"
        [chromatographyRows]="getChromatographyRows()"
        [assignedCompounds]="assignedCompoundsForFormDon()"
        [compoundDisplayNames]="compoundDisplayNames()"
        [bulkCalibVialStart]="bulkCalibVialStart"
        [bulkCalibVialEnd]="bulkCalibVialEnd"
        [bulkVialStart]="bulkVialStart"
        [bulkVialEnd]="bulkVialEnd"
        [isReadOnly]="isReadOnly"
        (bulkCalibVialStartChange)="bulkCalibVialStart = $event; onBulkCalibVialStartChange()"
        (applyCalibVials)="applyCalibVials()"
        (calibPointsChanged)="onBulkCalibPointsChanged()"
        (bulkVialStartChange)="bulkVialStart = $event; onBulkVialStartChange()"
        (applyBulkVials)="applyBulkVials()"
        (activeCompoundChanged)="onActiveCompoundChanged()"
        (bulkFillNd)="bulkFillNDFormDon()"
        (finalToggled)="onFinalToggled()"
        (syncDilution)="syncDilution($event)"
        (chromResultChanged)="onChromResultChanged($event)"
        (dataChanged)="onDataChanged()" />
    </div>
  }
</div>
